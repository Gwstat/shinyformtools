<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-label="Database layout created by shinyformtools: the sft_forms and sft_fields system tables describe the form, the data table holds the records with fourteen system columns, sft_audit_log holds one row per mutation, and sft_schema_migrations and sft_user_preferences are keyed by form_id.">
  <style>
    .box   { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .hdr   { fill: #f6f8fa; }
    .hdrd  { fill: #ddf4ff; }
    .boxd  { fill: #ffffff; stroke: #54aeff; stroke-width: 1.5; }
    .t     { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
             font-size: 13px; font-weight: 600; fill: #1f2328; }
    .c     { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
             font-size: 11.5px; fill: #1f2328; }
    .cm    { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
             font-size: 11.5px; fill: #8c959f; }
    .tag   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
             font-size: 9.5px; fill: #8c959f; }
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
             font-size: 10.5px; fill: #57606a; }
    .lbli  { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
             font-size: 10.5px; fill: #57606a; font-style: italic; }
    .rel   { stroke: #57606a; stroke-width: 1.3; fill: none; }
    .reld  { stroke: #8c959f; stroke-width: 1.3; fill: none; stroke-dasharray: 4 3; }
    .sep   { stroke: #d0d7de; stroke-width: 1; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/>
    </marker>
  </defs>

  <!-- ============ sft_forms ============ -->
  <rect class="box" x="30" y="30" width="250" height="175" rx="6"/>
  <path class="hdr" d="M30 36 a6 6 0 0 1 6 -6 h238 a6 6 0 0 1 6 6 v22 h-250 z"/>
  <line class="sep" x1="30" y1="58" x2="280" y2="58"/>
  <text class="t"  x="44" y="48">sft_forms</text>
  <text class="tag" x="266" y="48" text-anchor="end">one row per form</text>
  <text class="c"  x="44" y="78">form_id</text><text class="tag" x="266" y="78" text-anchor="end">PK</text>
  <text class="c"  x="44" y="94">form_name</text>
  <text class="c"  x="44" y="110">table_name</text>
  <text class="c"  x="44" y="126">active_version</text>
  <text class="c"  x="44" y="142">status</text>
  <text class="c"  x="44" y="158">config_json</text>
  <text class="c"  x="44" y="174">schema_hash</text>
  <text class="cm" x="44" y="190">created_at, updated_at</text>

  <!-- ============ sft_fields ============ -->
  <rect class="box" x="30" y="245" width="250" height="205" rx="6"/>
  <path class="hdr" d="M30 251 a6 6 0 0 1 6 -6 h238 a6 6 0 0 1 6 6 v22 h-250 z"/>
  <line class="sep" x1="30" y1="273" x2="280" y2="273"/>
  <text class="t"  x="44" y="263">sft_fields</text>
  <text class="tag" x="266" y="263" text-anchor="end">one row per field</text>
  <text class="c"  x="44" y="293">form_id</text><text class="tag" x="266" y="293" text-anchor="end">PK</text>
  <text class="c"  x="44" y="309">field_id</text><text class="tag" x="266" y="309" text-anchor="end">PK</text>
  <text class="c"  x="44" y="325">db_column</text>
  <text class="c"  x="44" y="341">label</text>
  <text class="c"  x="44" y="357">input_type</text>
  <text class="c"  x="44" y="373">db_type</text>
  <text class="c"  x="44" y="389">status</text>
  <text class="c"  x="44" y="405">mandatory</text>
  <text class="c"  x="44" y="421">unique_field</text>
  <text class="cm" x="44" y="437">args_json, layout, ...</text>

  <!-- ============ data table ============ -->
  <rect class="boxd" x="355" y="30" width="270" height="420" rx="6"/>
  <path class="hdrd" d="M355 36 a6 6 0 0 1 6 -6 h258 a6 6 0 0 1 6 6 v22 h-270 z"/>
  <line class="sep" x1="355" y1="58" x2="625" y2="58"/>
  <text class="t"  x="369" y="48">contacts</text>
  <text class="tag" x="611" y="48" text-anchor="end">your data table</text>
  <text class="c"  x="369" y="78">sft_id</text><text class="tag" x="611" y="78" text-anchor="end">PK</text>
  <text class="c"  x="369" y="94">sft_uuid</text><text class="tag" x="611" y="94" text-anchor="end">UNIQUE</text>
  <text class="c"  x="369" y="110">sft_easy_id</text>
  <text class="c"  x="369" y="126">sft_form_id</text>
  <text class="c"  x="369" y="142">sft_form_version</text>
  <text class="c"  x="369" y="158">sft_schema_hash</text>
  <text class="c"  x="369" y="174">sft_created_at</text>
  <text class="c"  x="369" y="190">sft_created_by</text>
  <text class="c"  x="369" y="206">sft_updated_at</text>
  <text class="c"  x="369" y="222">sft_updated_by</text>
  <text class="c"  x="369" y="238">sft_deleted_at</text>
  <text class="c"  x="369" y="254">sft_deleted_by</text>
  <text class="c"  x="369" y="270">sft_is_deleted</text><text class="tag" x="611" y="270" text-anchor="end">0 = live</text>
  <text class="c"  x="369" y="286">sft_unique_slot</text><text class="tag" x="611" y="286" text-anchor="end">0 = live</text>
  <line class="sep" x1="369" y1="300" x2="611" y2="300"/>
  <text class="tag" x="369" y="316">your declared fields</text>
  <text class="c"  x="369" y="336">name</text>
  <text class="c"  x="369" y="352">email</text><text class="tag" x="611" y="352" text-anchor="end">UNIQUE (email, sft_unique_slot)</text>
  <text class="c"  x="369" y="368">role</text>
  <text class="c"  x="369" y="384">joined</text>
  <text class="lbli" x="369" y="410">One table per form. Several forms</text>
  <text class="lbli" x="369" y="424">may share one, split by sft_form_id.</text>

  <!-- ============ sft_audit_log ============ -->
  <rect class="box" x="700" y="30" width="230" height="250" rx="6"/>
  <path class="hdr" d="M700 36 a6 6 0 0 1 6 -6 h218 a6 6 0 0 1 6 6 v22 h-230 z"/>
  <line class="sep" x1="700" y1="58" x2="930" y2="58"/>
  <text class="t"  x="714" y="48">sft_audit_log</text>
  <text class="c"  x="714" y="78">log_id</text><text class="tag" x="916" y="78" text-anchor="end">PK</text>
  <text class="c"  x="714" y="94">form_id</text>
  <text class="c"  x="714" y="110">table_name</text>
  <text class="c"  x="714" y="126">record_id</text>
  <text class="c"  x="714" y="142">record_uuid</text>
  <text class="c"  x="714" y="158">action</text>
  <text class="c"  x="714" y="174">version_no</text>
  <text class="c"  x="714" y="190">changed_at</text>
  <text class="c"  x="714" y="206">changed_by</text>
  <text class="c"  x="714" y="222">old_data_json</text>
  <text class="c"  x="714" y="238">new_data_json</text>
  <text class="c"  x="714" y="254">changed_fields_json</text>
  <text class="c"  x="714" y="270">reason</text>

  <!-- ============ sft_schema_migrations ============ -->
  <rect class="box" x="355" y="500" width="270" height="180" rx="6"/>
  <path class="hdr" d="M355 506 a6 6 0 0 1 6 -6 h258 a6 6 0 0 1 6 6 v22 h-270 z"/>
  <line class="sep" x1="355" y1="528" x2="625" y2="528"/>
  <text class="t"  x="369" y="518">sft_schema_migrations</text>
  <text class="tag" x="611" y="518" text-anchor="end">keyed by form_id</text>
  <text class="c"  x="369" y="548">migration_id</text><text class="tag" x="611" y="548" text-anchor="end">PK</text>
  <text class="c"  x="369" y="564">form_id</text>
  <text class="c"  x="369" y="580">table_name</text>
  <text class="c"  x="369" y="596">from_version</text>
  <text class="c"  x="369" y="612">to_version</text>
  <text class="c"  x="369" y="628">action</text>
  <text class="cm" x="369" y="644">field_id, db_column</text>
  <text class="cm" x="369" y="660">details_json, applied_at/by</text>

  <!-- ============ sft_user_preferences ============ -->
  <rect class="box" x="700" y="500" width="230" height="180" rx="6"/>
  <path class="hdr" d="M700 506 a6 6 0 0 1 6 -6 h218 a6 6 0 0 1 6 6 v22 h-230 z"/>
  <line class="sep" x1="700" y1="528" x2="930" y2="528"/>
  <text class="t"  x="714" y="518">sft_user_preferences</text>
  <text class="c"  x="714" y="548">preference_id</text><text class="tag" x="916" y="548" text-anchor="end">PK</text>
  <text class="c"  x="714" y="564">form_id</text>
  <text class="c"  x="714" y="580">user_id</text>
  <text class="c"  x="714" y="596">preference_key</text>
  <text class="c"  x="714" y="612">preference_json</text>
  <text class="c"  x="714" y="628">updated_at</text>
  <text class="lbli" x="714" y="654">UI state only (saved column</text>
  <text class="lbli" x="714" y="668">views), keyed by form_id.</text>

  <!-- ============ relations ============ -->
  <!-- sft_forms.form_id -> data.sft_form_id -->
  <path class="rel" d="M280 100 H 355" marker-end="url(#arrow)"/>
  <text class="lbl" x="318" y="92" text-anchor="middle">1:N</text>
  <text class="lbl" x="318" y="118" text-anchor="middle">form_id</text>

  <!-- sft_forms.form_id -> sft_fields.form_id -->
  <path class="rel" d="M155 205 V 245" marker-end="url(#arrow)"/>
  <text class="lbl" x="163" y="230">1:N  form_id</text>

  <!-- sft_fields.db_column names a column in the data table -->
  <path class="reld" d="M280 325 C 318 325, 318 336, 355 336" marker-end="url(#arrowm)"/>
  <text class="lbl" x="318" y="316" text-anchor="middle">db_column</text>

  <!-- data.sft_id -> audit.record_id -->
  <path class="rel" d="M625 126 H 700" marker-end="url(#arrow)"/>
  <text class="lbl" x="663" y="118" text-anchor="middle">1:N</text>
  <text class="lbl" x="663" y="144" text-anchor="middle">sft_id</text>

  <!-- ============ legend ============ -->
  <rect class="box" x="30" y="500" width="250" height="180" rx="6"/>
  <path class="hdr" d="M30 506 a6 6 0 0 1 6 -6 h238 a6 6 0 0 1 6 6 v22 h-250 z"/>
  <line class="sep" x1="30" y1="528" x2="280" y2="528"/>
  <text class="t" x="44" y="518">Reading this diagram</text>
  <path class="rel" d="M44 546 H 76" marker-end="url(#arrow)"/>
  <text class="lbl" x="86" y="550">a logical reference</text>
  <path class="reld" d="M44 570 H 76" marker-end="url(#arrowm)"/>
  <text class="lbl" x="86" y="574">a name, not an id</text>
  <text class="lbl" x="44" y="602">The package declares no</text>
  <text class="lbl" x="44" y="616">FOREIGN KEY constraints:</text>
  <text class="lbl" x="44" y="630">these links are conventions</text>
  <text class="lbl" x="44" y="644">the code upholds, so the</text>
  <text class="lbl" x="44" y="658">database will not enforce</text>
  <text class="lbl" x="44" y="672">them for you.</text>
</svg>
